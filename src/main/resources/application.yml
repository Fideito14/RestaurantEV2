server:
  port: 8082

spring:
  application:
    name: pedidos-service
  datasource:
    url: jdbc:mysql://localhost:3306/db_pedidos?useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  openapi:
    hateoas:
      enabled: false