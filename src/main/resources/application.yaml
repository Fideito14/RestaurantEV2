server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: menu-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/platos/**

            - id: pedidos-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/pedidos/**