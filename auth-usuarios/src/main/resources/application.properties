# =============================================================
# AUTH-USUARIOS · application.properties (MariaDB + Flyway)
# =============================================================

# Crear BD vacía "restaurante_auth" en Laragon.
spring.datasource.url=jdbc:mariadb://localhost:3306/restaurante_auth
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Puerto (alineado a consumidores existentes)
server.port=8081

# JPA: Flyway controla el esquema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.application.name=auth-usuarios

# JWT
app.jwt.secret=CAMBIAR_ESTE_SECRETO_EN_PRODUCCION
app.jwt.expiration-minutes=180
